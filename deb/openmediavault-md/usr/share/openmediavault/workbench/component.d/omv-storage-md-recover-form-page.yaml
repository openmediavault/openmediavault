version: "1.0"
type: component
data:
  name: omv-storage-md-recover-form-page
  type: formPage
  config:
    request:
      service: MdMgmt
      post:
        method: add
    hints:
      - type: info
        text: _("Adding a disk to a degraded array starts the rebuild process. The kernel automatically syncs the data onto the new disk, which can take a very long time, so do not power off or reboot the system while it is in progress. Alternatively, a disk can be added to a healthy array as a <em>hot spare</em> that will be used automatically to replace a failed disk.")
        dismissible: true
        stateId: 51a88df9-8f6c-11f1-960b-5254001e0193
    fields:
      - type: select
        name: devicefile
        label: _("Device")
        valueField: devicefile
        textField: description
        disabled: true
        value: '{{ _routeParams.devicefile }}'
        store:
          proxy:
            service: MdMgmt
            get:
              method: enumerateDevices
      - type: select
        name: devices
        label: _("Devices")
        placeholder: _("Select devices ...")
        hint: _("Select devices to be added to the RAID device.")
        multiple: true
        valueField: devicefile
        textField: description
        store:
          proxy:
            service: MdMgmt
            get:
              method: getCandidates
          filters:
            - operator: ne
              arg0:
                prop: devicefile
              arg1: '{{ _routeParams.devicefile }}'
          sorters:
            - dir: asc
              prop: devicefile
        validators:
          required: true
    buttons:
      - template: submit
        execute:
          type: url
          url: '/storage/md'
      - template: cancel
        execute:
          type: url
          url: '/storage/md'
