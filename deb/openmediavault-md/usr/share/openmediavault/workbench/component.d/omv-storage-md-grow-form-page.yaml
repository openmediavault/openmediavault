version: "1.0"
type: component
data:
  name: omv-storage-md-grow-form-page
  type: formPage
  config:
    request:
      service: MdMgmt
      post:
        method: grow
    hints:
      - type: info
        text: _("Adding disk(s) to the array reshapes it, which can take a very long time depending on its size. Do not power off or reboot the system while the reshape is in progress. Note that the file system on the array is not grown automatically.")
        dismissible: true
        stateId: 56eed45c-8f6c-11f1-827c-5254001e0193
    fields:
      - type: select
        name: devicefile
        label: _("Device")
        valueField: devicefile
        textField: description
        disabled: true
        value: '{{ _routeParams.devicefile }}'
        store:
          proxy:
            service: MdMgmt
            get:
              method: enumerateDevices
      - type: select
        name: devices
        label: _("Devices")
        placeholder: _("Select devices ...")
        hint: _("Select devices to be added to the RAID device.")
        multiple: true
        valueField: devicefile
        textField: description
        store:
          proxy:
            service: MdMgmt
            get:
              method: getCandidates
          filters:
            - operator: ne
              arg0:
                prop: devicefile
              arg1: '{{ _routeParams.devicefile }}'
          sorters:
            - dir: asc
              prop: devicefile
        validators:
          required: true
    buttons:
      - template: submit
        execute:
          type: url
          url: '/storage/md'
      - template: cancel
        execute:
          type: url
          url: '/storage/md'
